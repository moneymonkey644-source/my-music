<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Music</title>
<style>
  :root{
    --ink:#14161c;
    --panel:#1d2029;
    --panel-hi:#262a36;
    --line:#333747;
    --text:#f1ede3;
    --text-dim:#9a9fb0;
    --amber:#e0965c;
    --amber-dim:#7a5a3f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Sora',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap');

  header{
    padding:2.2rem 1.6rem 1.4rem;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.9rem;
    margin:0 0 .3rem;
    letter-spacing:.2px;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:.9rem;
  }

  main{
    flex:1;
    max-width:760px;
    width:100%;
    margin:0 auto;
    padding:1.6rem;
    padding-bottom:8rem;
  }

  .toolbar{
    display:flex;
    gap:.7rem;
    align-items:center;
    margin-bottom:1.4rem;
    flex-wrap:wrap;
  }
  .btn{
    background:var(--amber);
    color:#1a1408;
    border:none;
    border-radius:8px;
    padding:.65rem 1.1rem;
    font-family:inherit;
    font-weight:600;
    font-size:.9rem;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:hover{ background:#e7a771; }
  .btn:active{ transform:scale(.97); }
  .btn.ghost{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
    font-weight:500;
  }
  .btn.ghost:hover{ border-color:var(--amber-dim); }
  input[type="file"]{ display:none; }

  .search{
    flex:1;
    min-width:140px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.6rem .8rem;
    color:var(--text);
    font-family:inherit;
    font-size:.9rem;
  }
  .search::placeholder{ color:var(--text-dim); }
  .search:focus{ outline:none; border-color:var(--amber-dim); }

  .empty{
    text-align:center;
    padding:4rem 1rem;
    color:var(--text-dim);
  }
  .empty .glyph{
    font-family:'Fraunces',serif;
    font-size:2.4rem;
    color:var(--amber-dim);
    margin-bottom:.6rem;
  }

  .track{
    display:flex;
    align-items:center;
    gap:.9rem;
    padding:.7rem .8rem;
    border-radius:10px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .track:hover{ background:var(--panel); }
  .track.active{
    background:var(--panel-hi);
    border-color:var(--amber-dim);
  }
  .track .idx{
    width:1.6rem;
    text-align:center;
    color:var(--text-dim);
    font-size:.85rem;
    flex-shrink:0;
  }
  .track.active .idx{ color:var(--amber); }
  .track .meta{
    flex:1;
    min-width:0;
  }
  .track .title{
    font-weight:500;
    font-size:.95rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track .dur{
    color:var(--text-dim);
    font-size:.8rem;
    flex-shrink:0;
  }
  .track .remove{
    background:none;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    font-size:1.1rem;
    padding:.2rem .4rem;
    border-radius:6px;
    flex-shrink:0;
    opacity:0;
    transition:opacity .12s ease;
  }
  .track:hover .remove{ opacity:1; }
  .track .remove:hover{ color:#e6785f; background:var(--ink); }

  footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:.9rem 1.2rem;
    display:flex;
    align-items:center;
    gap:1rem;
  }
  .now-playing{
    width:140px;
    flex-shrink:0;
  }
  .now-playing .title{
    font-weight:600;
    font-size:.88rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .now-playing .sub{
    color:var(--text-dim);
    font-size:.75rem;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:.9rem;
    flex-shrink:0;
  }
  .icon-btn{
    background:none;
    border:none;
    color:var(--text);
    cursor:pointer;
    font-size:1.15rem;
    padding:.3rem;
    line-height:1;
  }
  .icon-btn.play{
    background:var(--amber);
    color:#1a1408;
    width:2.4rem;
    height:2.4rem;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1rem;
  }
  .seek-wrap{
    flex:1;
    display:flex;
    align-items:center;
    gap:.6rem;
    min-width:100px;
  }
  .seek-wrap span{
    color:var(--text-dim);
    font-size:.75rem;
    width:2.4rem;
    flex-shrink:0;
  }
  .seek-wrap span:last-child{ text-align:right; }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:4px;
    border-radius:2px;
    background:var(--line);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--amber);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--amber);
    border:none;
    cursor:pointer;
  }
  .volume{
    width:80px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:.4rem;
  }
  .volume input{ width:70px; }

  @media (max-width:640px){
    .now-playing{ display:none; }
    .volume{ display:none; }
    footer{ padding:.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>My Music</h1>
  <p>Your own private library — nothing here but the songs you add.</p>
</header>

<main>
  <div class="toolbar">
    <button class="btn" id="addBtn">Add music</button>
    <input type="file" id="fileInput" accept="audio/*" multiple>
    <input type="text" class="search" id="search" placeholder="Search your library…">
  </div>

  <div id="list"></div>
</main>

<footer>
  <div class="now-playing">
    <div class="title" id="npTitle">Nothing playing</div>
    <div class="sub" id="npSub">Add a song to start</div>
  </div>
  <div class="controls">
    <button class="icon-btn" id="prevBtn" title="Previous">⏮</button>
    <button class="icon-btn play" id="playBtn" title="Play">▶</button>
    <button class="icon-btn" id="nextBtn" title="Next">⏭</button>
  </div>
  <div class="seek-wrap">
    <span id="curTime">0:00</span>
    <input type="range" id="seek" min="0" max="100" value="0">
    <span id="durTime">0:00</span>
  </div>
  <div class="volume">
    <span>🔊</span>
    <input type="range" id="vol" min="0" max="100" value="80">
  </div>
</footer>

<script>
// ---------- IndexedDB storage so songs survive a page reload ----------
const DB_NAME = 'my-music-db';
const STORE = 'songs';
let db;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbAdd(song){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(song);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

// ---------- App state ----------
let songs = [];         // {id, name, blob, url}
let currentIndex = -1;
let filterText = '';

const audio = new Audio();

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const addBtn = document.getElementById('addBtn');
const fileInput = document.getElementById('fileInput');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const seek = document.getElementById('seek');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const vol = document.getElementById('vol');
const npTitle = document.getElementById('npTitle');
const npSub = document.getElementById('npSub');

function cleanName(filename){
  return filename.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
}

function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

async function init(){
  db = await openDB();
  const stored = await dbGetAll();
  songs = stored.map(s => ({ ...s, url: URL.createObjectURL(s.blob) }));
  render();
}

function render(){
  const q = filterText.toLowerCase();
  const filtered = songs
    .map((s, i) => ({ ...s, i }))
    .filter(s => cleanName(s.name).toLowerCase().includes(q));

  if (songs.length === 0){
    listEl.innerHTML = `
      <div class="empty">
        <div class="glyph">♪</div>
        <div>No songs yet. Click "Add music" to bring in your files.</div>
      </div>`;
    return;
  }

  if (filtered.length === 0){
    listEl.innerHTML = `<div class="empty">No songs match "${escapeHtml(filterText)}".</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(s => `
    <div class="track ${s.i === currentIndex ? 'active' : ''}" data-index="${s.i}">
      <div class="idx">${s.i === currentIndex && !audio.paused ? '♫' : s.i + 1}</div>
      <div class="meta">
        <div class="title">${escapeHtml(cleanName(s.name))}</div>
      </div>
      <button class="remove" data-remove="${s.i}" title="Remove">✕</button>
    </div>
  `).join('');

  listEl.querySelectorAll('.track').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.remove')) return;
      const idx = parseInt(el.dataset.index, 10);
      playIndex(idx);
    });
  });
  listEl.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      removeSong(parseInt(el.dataset.remove, 10));
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function handleFiles(fileList){
  for (const file of fileList){
    if (!file.type.startsWith('audio/')) continue;
    const song = { id: crypto.randomUUID(), name: file.name, blob: file };
    await dbAdd(song);
    songs.push({ ...song, url: URL.createObjectURL(song.blob) });
  }
  render();
}

async function removeSong(index){
  const song = songs[index];
  if (!song) return;
  if (index === currentIndex){
    audio.pause();
    audio.src = '';
    currentIndex = -1;
    updateNowPlaying();
  } else if (index < currentIndex){
    currentIndex -= 1;
  }
  await dbDelete(song.id);
  URL.revokeObjectURL(song.url);
  songs.splice(index, 1);
  render();
}

function playIndex(index){
  const song = songs[index];
  if (!song) return;
  currentIndex = index;
  audio.src = song.url;
  audio.play();
  updateNowPlaying();
  render();
}

function updateNowPlaying(){
  const song = songs[currentIndex];
  if (!song){
    npTitle.textContent = 'Nothing playing';
    npSub.textContent = 'Add a song to start';
    playBtn.textContent = '▶';
    return;
  }
  npTitle.textContent = cleanName(song.name);
  npSub.textContent = `Track ${currentIndex + 1} of ${songs.length}`;
  playBtn.textContent = audio.paused ? '▶' : '⏸';
}

// ---------- Controls ----------
addBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

searchEl.addEventListener('input', (e) => {
  filterText = e.target.value;
  render();
});

playBtn.addEventListener('click', () => {
  if (currentIndex === -1){
    if (songs.length > 0) playIndex(0);
    return;
  }
  if (audio.paused) audio.play(); else audio.pause();
});

prevBtn.addEventListener('click', () => {
  if (songs.length === 0) return;
  const next = currentIndex <= 0 ? songs.length - 1 : currentIndex - 1;
  playIndex(next);
});

nextBtn.addEventListener('click', () => {
  if (songs.length === 0) return;
  const next = currentIndex >= songs.length - 1 ? 0 : currentIndex + 1;
  playIndex(next);
});

audio.addEventListener('play', () => { playBtn.textContent = '⏸'; render(); });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; render(); });
audio.addEventListener('ended', () => nextBtn.click());

audio.addEventListener('timeupdate', () => {
  if (!isFinite(audio.duration)) return;
  seek.value = (audio.currentTime / audio.duration) * 100;
  curTime.textContent = fmtTime(audio.currentTime);
  durTime.textContent = fmtTime(audio.duration);
});

seek.addEventListener('input', () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (seek.value / 100) * audio.duration;
});

vol.addEventListener('input', () => {
  audio.volume = vol.value / 100;
});
audio.volume = 0.8;

init();
</script>

</body>
</html>
